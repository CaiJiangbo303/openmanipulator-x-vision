object_tracker:
  ros__parameters:
    input_topic: /object_detector/detections
    output_topic: /object_tracker/detections

    iou_threshold: 0.20
    max_missed: 5

    center_distance_threshold: 0.75
    max_area_ratio: 2.0
    fallback_max_missed: 2

    new_track_confirm_hits: 3
    tentative_max_missed: 1

    duplicate_containment_threshold: 0.70
    duplicate_min_area_ratio: 1.40

    class_alias_groups: "cell phone|smartphone|mobile phone; toy brick|building brick; screwdriver|screw driver; blue block|plastic cube"

    use_sim_time: false
