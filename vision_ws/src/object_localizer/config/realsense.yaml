object_localizer:
  ros__parameters:

    # Fast path: tracker bbox + aligned RealSense depth.
    # This path must remain available even when SAM2 is
    # delayed or temporarily unavailable.
    detections_topic: /object_tracker/detections

    depth_topic: /camera/camera/aligned_depth_to_color/image_raw

    # Aligned depth uses COLOR pixel geometry.
    camera_info_topic: /camera/camera/color/camera_info

    output_topic: /object_localizer/detections_3d_fast

    # Trust the actual frame carried by aligned depth.
    use_depth_frame_id: true

    world_frame: world

    # Use only the inner bbox region to reduce background
    # contamination near object boundaries.
    roi_scale: 0.60

    min_depth: 0.05
    max_depth: 3.0
    min_valid_pixels: 20

    # Timestamp-keyed RGB-D matching
    depth_cache_size: 16
    detection_cache_size: 16
    detection_cache_ttl_sec: 0.50

    # Exact source-stamp matching for now.
    # Guarded delayed fallback can be enabled later after real-camera validation.
    max_depth_time_diff_ms: 0.0

    # Non-blocking exact-stamp TF gate
    tf_pending_queue_size: 16
    tf_pending_ttl_sec: 0.50
    tf_poll_period_sec: 0.02


mask_localizer:
  ros__parameters:

    detections_topic: /object_tracker/detections
    mask_topic: /object_segmenter/instance_mask

    # RealSense depth aligned into COLOR pixel coordinates.
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw

    # Use COLOR intrinsics because depth has been aligned
    # into the color image coordinate system.
    camera_info_topic: /camera/camera/color/camera_info

    output_topic: /object_localizer/detections_3d_mask

    # Real hardware should trust the frame carried by the
    # aligned depth message rather than a hard-coded frame.
    use_depth_frame_id: true

    world_frame: world

    min_depth: 0.05
    max_depth: 3.0
    min_valid_pixels: 10
