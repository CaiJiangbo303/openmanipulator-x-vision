object_detector:
  ros__parameters:
    backend: "yoloe"
    image_topic: /camera/camera/color/image_raw

    model: "yoloe-26s-seg-pf.pt"

    confidence: 0.25
    iou: 0.45
    imgsz: 640

    device: "0"
    quantize: "16"

    prompt_mode: "prompt_free"
    prompt_classes: ""

    min_bbox_area: 0.0
    use_sim_time: false
